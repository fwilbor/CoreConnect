<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#171717;max-width:480px">
  <h2 style="font-size:20px;margin:0 0 12px">Sign in to CoreConnect</h2>
  <p style="margin:0 0 16px">Enter this code on the sign-in page:</p>
  <p style="font-size:28px;font-weight:600;letter-spacing:4px;margin:0 0 20px">{{ .Token }}</p>
  <p style="margin:0 0 16px">Or <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">sign in with this link</a>. It works in any browser.</p>
  <p style="margin:0;color:#737373;font-size:13px">The code and link work once and expire in an hour. If you didn't ask to sign in, you can ignore this email.</p>
</div>
